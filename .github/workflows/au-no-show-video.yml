name: Build AU No-Show Video (real footage)
on:
  push:
    branches:
      - au-no-show-video-draft-20261117
    paths:
      - scripts/social_video/build_no_show.py
      - .github/workflows/au-no-show-video.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout video-only branch
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Install video tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
          python -m pip install --user pillow
      - name: Fetch original licensed camera footage and edit MP4
        run: python scripts/social_video/build_no_show.py
      - name: Attach final review copy
        uses: actions/upload-artifact@v4
        with:
          name: AU-no-show-live-footage-review
          path: social-video-output/
          retention-days: 14
      - name: Save review video only on dedicated branch
        run: |
          git config user.name "AU Social Video Build"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add social-video-output/
          git commit -m "Draft social video for review [skip ci]"
          git push origin HEAD:au-no-show-video-draft-20261117
