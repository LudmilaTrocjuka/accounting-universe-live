name: Restore AU Christmas cash-flow page (December 2026)

on:
  schedule:
    - cron: '15 7 1-3 12 *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: au-christmas-page-2026
  cancel-in-progress: false

jobs:
  restore:
    if: github.repository == 'LudmilaTrocjuka/accounting-universe-live'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          fetch-depth: 0

      - name: Restore original article and remove temporary redirect
        shell: bash
        run: |
          python3 - <<'PY'
          from datetime import datetime, timezone
          from pathlib import Path
          import json
          import subprocess

          today = datetime.now(timezone.utc).date()
          if not (today.year == 2026 and today.month == 12 and 1 <= today.day <= 3):
              print("Outside authorised December 2026 publishing window; no changes")
              raise SystemExit(0)

          article = Path("christmas-cash-flow.html")
          config_path = Path("vercel.json")
          home_path = Path("index.html")
          sitemap_path = Path("sitemap.xml")
          assert Path("images/au-social-logo-1200x630.png").is_file(), "Wide social sharing image missing"

          config = json.loads(config_path.read_text())
          source = "/christmas-cash-flow.html"
          destination = "/cash-flow-forecasting.html"
          matching = [r for r in config.get("redirects", []) if r.get("source") == source]
          if article.is_file() and not matching:
              print("Article already restored and redirect removed; no changes")
              raise SystemExit(0)

          expected = {"source": source, "destination": destination, "permanent": False}
          if matching != [expected] or article.exists():
              raise RuntimeError("Current article/redirect differs from the approved temporary state. Review before publishing.")

          original = subprocess.check_output(
              ["git", "show", "6bd8b524dfff2e216a61f4b2597bcb1aefc8e4c4:christmas-cash-flow.html"],
              text=True,
          )

          def replace_exact(content, old, new, count):
              assert content.count(old) == count, f"Expected {count} occurrences: {old}"
              return content.replace(old, new)

          old_image = "https://raw.githubusercontent.com/LudmilaTrocjuka/accounting-universe-live/main/images/au-social-logo-rgb.png"
          new_image = "https://www.accounting-universe.co.uk/images/au-social-logo-1200x630.png"
          restored = replace_exact(original, old_image, new_image, 3)
          restored = replace_exact(restored, 'content="256"', 'content="1200"', 2) if False else restored
          restored = replace_exact(restored, 'property="og:image:width" content="256"', 'property="og:image:width" content="1200"', 1)
          restored = replace_exact(restored, 'property="og:image:height" content="256"', 'property="og:image:height" content="630"', 1)
          restored = replace_exact(restored, 'name="twitter:card" content="summary"', 'name="twitter:card" content="summary_large_image"', 1)
          restored = replace_exact(restored, "AU Finance & Advisory logo, white AU letters on dark green", "AU Finance & Advisory logo — white AU on dark green", 2)
          assert 'href="https://www.accounting-universe.co.uk/christmas-cash-flow.html"' in restored
          assert restored.count(new_image) == 3

          home = home_path.read_text()
          assert source not in home, "Homepage already links to article; review its content"
          heading_pos = home.find("Accounting guidance for UK businesses")
          assert heading_pos >= 0, "Homepage guide heading changed"
          grid_marker = '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:1rem">'
          grid_pos = home.find(grid_marker, heading_pos)
          assert grid_pos >= 0, "Homepage guide grid changed"
          insertion_pos = grid_pos + len(grid_marker)
          card = '''
              <article style="background:#f1f7f2;border:1px solid #d7e7db;border-radius:10px;padding:1.15rem">
                <p style="font-size:.78rem;color:#38674e;font-weight:700;margin:0 0 .45rem">HOSPITALITY · DECEMBER 2026</p>
                <h4 style="font-size:1.1rem;line-height:1.35;margin:0 0 .6rem" data-heading-style="h5"><a href="/christmas-cash-flow.html">Christmas bookings and cash flow: four figures to monitor</a></h4>
                <p style="margin:0;font-size:.94rem">Booked covers, expected margin, staffing hours and supplier payments for the festive season.</p>
              </article>'''
          updated_home = home[:insertion_pos] + card + home[insertion_pos:]

          sitemap = sitemap_path.read_text()
          assert "christmas-cash-flow.html" not in sitemap, "Sitemap already references article"
          assert sitemap.count("</urlset>") == 1, "Unexpected sitemap format"
          entry = f'  <url><loc>https://www.accounting-universe.co.uk/christmas-cash-flow.html</loc><lastmod>{today.isoformat()}</lastmod></url>\n'
          updated_sitemap = sitemap.replace("</urlset>", entry + "</urlset>")

          config["redirects"] = [r for r in config["redirects"] if r.get("source") != source]
          if not config["redirects"]:
              del config["redirects"]

          article.write_text(restored)
          home_path.write_text(updated_home)
          sitemap_path.write_text(updated_sitemap)
          config_path.write_text(json.dumps(config, indent=2) + "\n")
          print("Prepared original Christmas article, homepage card, sitemap entry and redirect removal")
          PY

      - name: Validate changes
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          config = json.loads(Path("vercel.json").read_text())
          if Path("christmas-cash-flow.html").is_file():
              assert not any(r.get("source") == "/christmas-cash-flow.html" for r in config.get("redirects", []))
              assert "/christmas-cash-flow.html" in Path("index.html").read_text()
              assert "christmas-cash-flow.html" in Path("sitemap.xml").read_text()
              article = Path("christmas-cash-flow.html").read_text()
              assert "summary_large_image" in article and "au-social-logo-1200x630.png" in article
              print("Christmas page validation passed")
          else:
              print("Outside publication window: no change requested")
          PY

      - name: Commit restored page for Vercel production deployment
        shell: bash
        run: |
          git add -- christmas-cash-flow.html index.html sitemap.xml vercel.json
          if git diff --cached --quiet; then
            echo "No changes to publish."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Restore festive cash-flow guide in December; retire temporary redirect"
          git push origin HEAD:main
