name: Check analytics coverage on all pages
on:
  push:
    branches: [main]
    paths:
      - '*.html'
      - 'metricool.js'
      - 'tests/analytics-coverage.test.cjs'
      - '.github/workflows/analytics-coverage.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  analytics-coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - run: node --test tests/analytics-coverage.test.cjs
