name: Import and optimise website photographs
on:
  push:
    branches:
      - improve-services-and-pricing-oct-2026
    paths:
      - .github/workflows/import-website-photos.yml
permissions:
  contents: write
jobs:
  import-images:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout development branch
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Install image processing
        run: python -m pip install --disable-pip-version-check Pillow
      - name: Download, inspect and store photographs locally
        run: |
          python - <<'PY'
          import io, os, urllib.request
          from PIL import Image, ImageOps, ImageEnhance, ImageFilter, ImageStat
          images = {
              'restaurant-bright.jpg':'1677129661951-6efe6e5584ee',
              'pub-bright.jpg':'1514933651103-005eec06c04b',
              'travel-bright.jpg':'1488646953014-85cb44e25828',
              'conference-bright.jpg':'1511578314322-379afb476865',
              'hero-office-bright.jpg':'1497366811353-6870744d04b2',
              'finance-bright.jpg':'1460925895917-afdab827c52f'
          }
          os.makedirs('images',exist_ok=True)
          for filename, photo_id in images.items():
              src = f'https://images.unsplash.com/photo-{photo_id}?fit=max&w=2600&q=93'
              req = urllib.request.Request(src,headers={'User-Agent':'AccountingUniverseWebsite/1.0'})
              with urllib.request.urlopen(req, timeout=35) as response:
                  data = response.read()
              im = Image.open(io.BytesIO(data)).convert('RGB')
              if min(im.size) < 1100:
                  raise RuntimeError(f'{filename} resolution too low: {im.size}')
              # Fit image to site design without interpolating a smaller image upwards.
              size = (2000,1125) if filename.startswith(('hero-','finance-')) else (1800,1050)
              im = ImageOps.fit(im, size, method=Image.Resampling.LANCZOS, centering=(.5,.5))
              im = im.filter(ImageFilter.UnsharpMask(radius=1.1,percent=115,threshold=3))
              output = f'images/{filename}'
              im.save(output,'JPEG',quality=90,optimize=True,subsampling=0)
              with Image.open(output) as check:
                  assert check.size == size
              print(output, 'resolution',size, 'bytes',os.stat(output).st_size)
          PY
      - name: Commit locally stored images to preview branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add images/restaurant-bright.jpg images/pub-bright.jpg images/travel-bright.jpg images/conference-bright.jpg images/hero-office-bright.jpg images/finance-bright.jpg
          if ! git diff --cached --quiet; then
            git commit -m 'Store high-resolution website photos locally'
            git push
          fi
